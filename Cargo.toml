[workspace]
resolver = "2"
# vendor/ holds the vendored mlx-rs fork, which is its own workspace.
exclude = ["vendor"]
members = ["crates/oos-svc", "crates/oos-dsls", "services/oosai", "services/oosgql", "services/oosagent", "services/oosiam", "services/bench-nats", "services/oosmem", "tools/oosrun", "crates/oos-infer", "services/oosmlx"]

[workspace.package]
edition = "2021"
authors = ["Frank von Schrenk"]

# Shared dependency versions. Member crates opt in with `.workspace = true`
# so every service moves in lockstep on a single bump.
[workspace.dependencies]
anyhow = "1.0.102"
async-nats = "0.49.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
futures = "0.3.32"
gethostname = "1.1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
oos-svc = { path = "crates/oos-svc" }
oos-dsls = { path = "crates/oos-dsls" }

[profile.release]
opt-level = "z"
lto = true
strip = true

# Vendored fork of mlx-rs `main` (see vendor/mlx-rs). Upstream mlx-rs 0.25.3 is
# affine-only; `main` bundles a mxfp4-capable mlx-c (v0.5.0 -> MLX v0.30.6) but
# still hard-codes the "affine" quant mode in its safe wrappers. Our fork threads
# an optional `mode` through quantize/quantized_matmul/dequantize so we can drive
# mxfp4/mxfp8 on Apple silicon (default stays affine). Default features incl. metal.
[patch.crates-io]
mlx-rs = { path = "vendor/mlx-rs/mlx-rs" }
