# Dev tooling, not a service: oosrun is a small process supervisor with a TUI
# that runs a named profile of the compiled onisin stack. It reads the profiles
# from oosrun.yaml, spawns each proc on its own pty (real tty -> colours,
# unbuffered output) and shows them in switchable panes. No external mprocs
# needed. Workspace member, so `cargo build --release` (make api / make all)
# emits ./target/release/oosrun alongside the services.
[package]
name = "oosrun"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[[bin]]
name = "oosrun"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
crossterm = "0.29.0"
libc = "0.2.186"
portable-pty = "0.9.0"
ratatui = "0.30.1"
serde = { workspace = true, features = ["derive"] }
serde_yaml = "0.9.34"
vt100 = "0.16.2"
