[package]
name = "bench-nats"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
# bench-nats is a generic MCP<->NATS bridge with no domain logic, so it
# keeps the permissive Apache-2.0 of the original, separate from the
# BSL-1.1 of the rest of the workspace.
license = "Apache-2.0"

[[bin]]
name = "bench-nats"
path = "src/main.rs"

[dependencies]
# Shared, workspace-pinned.
anyhow = { workspace = true }
async-nats = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# bench-nats-only: the official MCP SDK. `transport-io` gives the stdio
# transport Claude.app spawns us with; `macros` provides #[tool]/
# #[tool_router]; `schemars` (re-exported) derives the tool input
# schemas. Pinned here rather than in workspace.deps because no other
# member touches MCP (same call as oosiam's axum/rsa).
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
