# Standalone workspace: this src-tauri is deliberately NOT a member of the
# root /Users/frank/repro/onisin Rust workspace (services/ + crates/). The
# empty [workspace] table detaches it so the Tauri binary keeps its own
# Cargo.lock and target/, exactly like oosd/oos and the crypto reference app.
[workspace]

[package]
name = "bench"
version = "0.8.0"
edition = "2021"
authors = ["Frank von Schrenk"]

[lib]
# Desktop entry point lives in the lib so the mobile entry-point macro can
# reuse it; main.rs is a thin shim that calls bench_lib::run().
name = "bench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10.2", features = [] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-store = "2.4.2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-os = "2"
tauri-plugin-process = "2"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

# Unlike oosd/oos (Pfad C, webview-talks-to-bus, no async-nats in the shell),
# bench's backend IS a NATS request-reply responder: its tools touch the local
# filesystem, spawn processes, and reach Postgres — work that cannot live in the
# sandboxed webview. So the shell connects to NATS itself. async-nats 0.49 to
# match the headless services; tokio full for spawn/time/process; futures for
# the subscription stream.
async-nats = "0.49"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# ISO-8601 timestamps in fs results (mtime), byte-identical to the old
# new Date(mtimeMs).toISOString() output.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Slice 2: exec_start session ids (uuid v4); content search (regex + a glob
# matcher with literal_separator so * does not cross / like the Bun glob).
# git and patch shell out via std::process — no extra crates.
uuid = { version = "1", features = ["v4"] }
regex = "1"
globset = "0.4"

# Slice 3: pg.* + task.* tools. sqlx 0.8.6 like oosd/oos (runtime queries, no
# compile-time DB); chrono feature to decode timestamptz -> RFC-3339. No json
# feature on purpose (jsonb is read as ::text, the oosgql/oosd convention).
# reqwest for the task embedding call to Ollama (granite-embedding, 384-dim).
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
